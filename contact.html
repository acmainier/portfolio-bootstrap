    <main class="container">
      <section class="mt-3 p-2 rounded-3" id="contact">
        <h2 class="mt-2 mb-2">Contact</h2>
        <p>Have an interesting project? I would love to hear about it!</p>
        <form action="submit.php" method="post">
          <div class="mb-3">
            <label class="form-label" for="contact-name">Name</label>
            <input
              type="text"
              id="contact-name"
              class="form-control"
              name="name"
              placeholder="Your name"
            />
          </div>
          <div class="mb-3">
            <label class="form-label" for="contact-project-date"
              >Starting date of the project</label
            >
            <input
              type="text"
              id="contact-project-date"
              class="form-control"
              name="project_date"
              placeholder="Starting date of the project"
            />
          </div>
          <div class="mb-3">
            <label class="form-label" for="email">Email</label>
            <input
              type="email"
              id="email"
              class="form-control"
              name="email"
              placeholder="Your email"
            />
          </div>
          <div class="mb-3">
            <label class="form-label" for="message">Message</label>
            <textarea
              id="message"
              name="message"
              class="form-control"
              rows="5"
              placeholder="Your message"
            ></textarea>
          </div>
          <button type="submit" class="btn btn-outline-success fw-bold">
            Send message
          </button>
        </form>

        <div class="d-flex flex-wrap gap-3 mt-3">
          <a
            href="https://www.linkedin.com/in/anne-cecile-mainier-57727923/"
            target="_blank"
            rel="noopener noreferrer"
            >LinkedIn</a
          >
          <a
            href="https://github.com/acmainier"
            target="_blank"
            rel="noopener noreferrer"
            >GitHub</a
          >
          <a href="mailto:notmyrealemail@gmail.com">Email</a>
          <a href="tel:0123456789">Phone</a>
        </div>
      </section>
    </main>
    <footer class="py-3 text-center">
      Made with <span class="heart">♥</span> in London
